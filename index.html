<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>THE RIDER No. 01 — 一台会跑单的外卖电动车</title>
<link rel="stylesheet" href="styles/main.css">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>
  <div id="labels"></div>

  <!-- 左上：标题区 -->
  <header id="brand">
    <h1>THE RIDER <span>No. 01</span></h1>
    <p class="sub">一台会跑单的外卖电动车</p>
    <p class="tag">每一份外卖抵达之前，都先跑过一段路。<br><em>Before every order arrives, it rides.</em></p>
  </header>

  <!-- 左下：控制台 -->
  <aside id="desk" class="panel">
    <div class="desk-head">
      <span class="dot"></span> CONTROL DESK
      <button id="desk-toggle" title="收起 / 展开">—</button>
    </div>
    <div class="desk-body">
      <section>
        <h3>机械</h3>
        <label class="row slider-row">
          <span>拆解</span>
          <input id="explode" type="range" min="0" max="100" value="0">
          <b id="explode-val">0%</b>
        </label>
        <div class="btn-row">
          <button id="cutaway">剖视</button>
        </div>
      </section>
      <section>
        <h3>视角</h3>
        <div class="btn-row views">
          <button data-view="ride" class="on">骑行</button>
          <button data-view="drive">电驱</button>
          <button data-view="inspect">检视</button>
          <button data-view="sound">声音</button>
        </div>
      </section>
      <section>
        <h3>骑行</h3>
        <div class="btn-row">
          <button id="head">大灯</button>
          <button id="sigL">左转</button>
          <button id="sigR">右转</button>
        </div>
        <div class="btn-row">
          <button id="horn">喇叭</button>
          <button id="box">开箱</button>
        </div>
      </section>
      <section>
        <h3>记录</h3>
        <div class="btn-row">
          <button id="reset-today">重置今日</button>
          <button id="export">导出海报</button>
          <button id="clear">清空</button>
        </div>
      </section>
      <section>
        <h3>导览</h3>
        <div class="btn-row">
          <button id="tour-start">开始导览</button>
        </div>
      </section>
      <div class="status">
        <span><b id="st-speed">0</b> km/h</span>
        <span>电量 <b id="st-battery">100%</b></span>
        <span><b id="st-odo">0.0</b> km</span>
        <span>今日 <b id="st-orders">0</b> 单</span>
      </div>
    </div>
  </aside>

  <!-- 右下：速度表 + 订单 -->
  <div id="hud">
    <div id="order-card" class="panel">
      <div class="oc-title">当前订单</div>
      <div class="oc-body">
        <div class="oc-num"><b id="oc-progress">0</b> / <span id="oc-target">300</span> m</div>
        <div class="bar"><i id="oc-bar"></i></div>
      </div>
    </div>
    <div id="speedo"><canvas id="speedo-cv" width="196" height="196"></canvas></div>
  </div>

  <!-- 导览卡片 -->
  <div id="tour-card" class="panel hidden">
    <div class="tc-step">第 <b id="tc-idx">1</b> / 5 步</div>
    <div class="tc-name" id="tc-name">车身</div>
    <div class="tc-desc" id="tc-desc"></div>
    <div class="tc-nav">
      <button id="tc-prev">上一步</button>
      <button id="tc-auto">自动播放</button>
      <button id="tc-next">下一步</button>
      <button id="tc-close">退出</button>
    </div>
  </div>

  <!-- 零件信息卡 -->
  <div id="part-card" class="panel hidden">
    <div class="pc-name" id="pc-name"></div>
    <div class="pc-desc" id="pc-desc"></div>
    <button id="pc-close">×</button>
  </div>

  <!-- 声音视角：波形 -->
  <div id="sound-viz" class="hidden"><canvas id="viz-cv"></canvas></div>

  <!-- 提示 -->
  <div id="hint">按住 <b>W</b> 出发。</div>
  <div id="audio-hint" class="hidden">点击任意处开启声音</div>

  <!-- 移动端触控 -->
  <div id="touch">
    <button id="tc-brake">刹车</button>
    <button id="tc-throttle">油门</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
